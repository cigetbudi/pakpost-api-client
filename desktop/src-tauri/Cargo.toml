[package]
name = "pakpost-desktop"
version = "0.1.2"
description = "PakPost API Workbench Desktop"
authors = ["cigetbudi"]
license = "GPL-3.0-only"
repository = "https://github.com/cigetbudi/pakpost-api-client"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pakpost_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "=2.14.1"
rusqlite = { version = "0.32", features = ["bundled"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots"] }
base64 = "0.22"

tokio = { version = "1", features = ["sync", "time", "macros", "net"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }

# Explicit native backends: no in-memory mock fallback on supported platforms.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
