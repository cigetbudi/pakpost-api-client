name: PakPost quality checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: make test-frontend test-docker
      - run: bun x playwright install --with-deps chromium
        working-directory: frontend
      - run: make test-e2e
      - run: bun x playwright test --config playwright.security.config.js
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: make test-backend
      - run: dotnet build backend/Pakpost.slnx
      - run: dotnet run --project backend/tests/Pakpost.SecurityChecks/Pakpost.SecurityChecks.csproj
  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libdbus-1-dev
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - run: make test-desktop
