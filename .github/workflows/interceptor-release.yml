name: PakPost Interceptor package

on:
  workflow_dispatch:
  push:
    tags:
      - 'interceptor-v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate extension security behavior
        run: node --test frontend/tests/network/interceptorPermissionModes.test.js frontend/tests/network/interceptorOriginDiscovery.test.js frontend/tests/network/interceptorTransport.test.js
      - name: Build and package Chrome/Firefox
        run: bash extension/release.sh
      - name: Upload versioned release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pakpost-interceptor
          path: |
            extension/releases/*.zip
            extension/releases/*.xpi
            extension/releases/SHA256SUMS
          if-no-files-found: error
